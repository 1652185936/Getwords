name: Build App

# Builds standalone desktop apps for Windows / macOS / Linux with PyInstaller
# and publishes them to a GitHub Release so they can be downloaded directly.

on:
  push:
    branches: ["claude/youtube-subtitle-extractor-xlv0xp"]
    tags: ["v*"]
    paths:
      - "app.py"
      - "desktop.py"
      - "exporters.py"
      - "transcript_service.py"
      - "getwords.spec"
      - "templates/**"
      - "static/**"
      - "requirements*.txt"
      - "installer/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          # pywebview gives a native window on Windows/macOS. On Linux we skip
          # it (needs system GTK libs); the app falls back to the browser there.
          if [ "$RUNNER_OS" != "Linux" ]; then
            pip install pywebview
          fi

      - name: Build executable
        shell: bash
        run: pyinstaller getwords.spec --noconfirm --clean

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer/getwords.iss

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows)
              cp "dist/GetWords.exe" "out/GetWords-Windows-x64.exe"
              if [ -f "installer_out/GetWords-Setup.exe" ]; then
                cp "installer_out/GetWords-Setup.exe" "out/GetWords-Windows-Setup.exe"
              fi
              ;;
            macOS)
              ( cd dist && zip -r "../out/GetWords-macOS-x64.zip" GetWords )
              ;;
            Linux)
              ( cd dist && tar czf "../out/GetWords-Linux-x64.tar.gz" GetWords )
              ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: GetWords-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Collect files
        run: |
          mkdir -p release
          find downloaded -type f -exec cp {} release/ \;
          echo "Release assets:"
          ls -la release

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: GetWords Desktop App (latest build)
          body: |
            ## 🎬 GetWords — YouTube Subtitle Extractor

            Standalone desktop app. Paste a YouTube URL, fetch the captions,
            export to **TXT / SRT / PDF**.

            ### Downloads
            - **Windows:** `GetWords-Windows-Setup.exe` (installer) or
              `GetWords-Windows-x64.exe` (portable — just double-click)
            - **macOS:** `GetWords-macOS-x64.zip` (unzip, then run `GetWords`)
            - **Linux:** `GetWords-Linux-x64.tar.gz`

            Built automatically by GitHub Actions from commit ${{ github.sha }}.
          files: release/*
          fail_on_unmatched_files: true
