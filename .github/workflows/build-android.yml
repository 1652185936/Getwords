name: Build Android APK

# Builds an installable Android .apk with Buildozer (Kivy / python-for-android)
# and publishes it to the 'app-latest' GitHub Release.

on:
  push:
    branches: ["claude/youtube-subtitle-extractor-xlv0xp"]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev build-essential ccache libltdl-dev \
            fonts-droid-fallback

      - name: Bundle a CJK font for PDF export
        run: |
          mkdir -p mobile/assets
          for f in \
            /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf \
            /usr/share/fonts/truetype/droid/DroidSansFallback.ttf ; do
            if [ -f "$f" ]; then cp "$f" mobile/assets/cjk.ttf; break; fi
          done
          ls -la mobile/assets

      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          # 'v2' + spec hash: a clean key so we never restore the earlier
          # broken Python-3.14 build tree.
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}

      - name: Fetch pinned python-for-android (Python 3.11)
        run: |
          git clone https://github.com/kivy/python-for-android.git "$HOME/p4a-src"
          git -C "$HOME/p4a-src" checkout v2024.01.21
          echo "p4a python3 recipe version:"
          grep -m1 "version = " "$HOME/p4a-src/pythonforandroid/recipes/python3/__init__.py"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Build debug APK
        working-directory: mobile
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer android debug

      - name: Rename APK
        run: |
          mkdir -p out
          cp mobile/bin/*.apk "out/GetWords-Android.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: GetWords-Android
          path: out/GetWords-Android.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          files: out/GetWords-Android.apk
